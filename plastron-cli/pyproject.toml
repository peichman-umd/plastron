[project]
name = "plastron-cli"
description = "Plastron command line client"
authors = [
    { name='University of Maryland Libraries', email='lib-ssdr@umd.edu' },
    { name='Josh Westgard', email='westgard@umd.edu' },
    { name='Peter Eichman', email='peichman@umd.edu' },
    { name='Mohamed Abdul Rasheed', email='mohideen@umd.edu' },
    { name='Ben Wallberg', email='wallberg@umd.edu' },
    { name='David Steelman', email='dsteelma@umd.edu' },
    { name='Marc Andreu Grillo Aguilar', email='aguilarm@umd.edu' },
]
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "BeautifulSoup4",
    "click>=8.5.0",
    "lxml<6.0",
    "Pillow",
    "plastron-jobs",
    "plastron-models",
    "plastron-repo",
    "plastron-utils",
    "pyparsing",
    "pysolr",
    "PyYAML",
    "rdflib",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "responses",
    "ruff",
]

[project.scripts]
plastron = "plastron.cli:plastron_command"

[project.entry-points.plastron_commands]
attach = "plastron.cli.commands.attach:attach_command"
create = "plastron.cli.commands.create:create_command"
delete = "plastron.cli.commands.delete:delete_command"
export = "plastron.cli.commands.export:export_command"
find = "plastron.cli.commands.find:find_command"
fixpageorder = "plastron.cli.commands.fixpageorder:fixpageorder_command"
fixitycheck = "plastron.cli.commands.fixitycheck:fixitycheck_command"
import = "plastron.cli.commands.importcommand:import_command"
ls = "plastron.cli.commands.list:ls_command"
ping = "plastron.cli.commands.ping:ping_command"
publish = "plastron.cli.commands.publish:publish_command"
reindex = "plastron.cli.commands.reindex:reindex_command"
replace = "plastron.cli.commands.replace:replace_command"
set = "plastron.cli.commands.set:set_command"
unpublish = "plastron.cli.commands.unpublish:unpublish_command"
update = "plastron.cli.commands.update:update_command"

[build-system]
requires = ["setuptools>=66.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { "file" = "VERSION" }

[tool.pytest.ini_options]
markers = ['jobs_dir']
